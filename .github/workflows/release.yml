name: Build and Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build RobinHood_ModernFix.exe
        run: pyinstaller --onefile --name RobinHood_ModernFix robinhood_modern_fix.py

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/RobinHood_ModernFix.exe
            DDrawCompat.ini
            README.md
