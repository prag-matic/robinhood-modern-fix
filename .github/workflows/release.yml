name: Build and Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build RobinHood_ModernFix.exe
        run: pyinstaller --onefile --add-data "assets/banner.png;assets" --name RobinHood_ModernFix robinhood_modern_fix.py

      - name: Download DDrawCompat v0.7.2
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/narzoul/DDrawCompat/releases/download/v0.7.2/DDrawCompat-v0.7.2.zip" -OutFile "DDrawCompat.zip"
          Expand-Archive -Path "DDrawCompat.zip" -DestinationPath "ddrawcompat_tmp" -Force

      - name: Package RobinHood_ModernFix.zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "bundle" -Force | Out-Null
          Copy-Item "dist/RobinHood_ModernFix.exe" "bundle/"
          Copy-Item "ddrawcompat_tmp/ddraw.dll" "bundle/"
          Copy-Item "DDrawCompat.ini" "bundle/"
          Copy-Item "README.md" "bundle/"
          Compress-Archive -Path "bundle/*" -DestinationPath "RobinHood_ModernFix.zip" -Force

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            RobinHood_ModernFix.zip
            dist/RobinHood_ModernFix.exe
